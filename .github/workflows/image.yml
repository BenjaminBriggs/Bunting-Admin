name: Image

# Builds the production `runner` image and runs the full-stack smoke against it
# through deploy/compose.yaml: real OIDC sign-in (dex), NODE_ENV=production,
# migrations, publish, then signature verification of the published artifact.
# release.yml calls this before publishing an image.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_call:

permissions:
  contents: read

jobs:
  production-smoke:
    name: Production image smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Use Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Tagged as deploy/compose.local.yaml expects, so compose reuses it.
      - name: Build production image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runner
          load: true
          tags: bunting-admin:local
          cache-from: type=gha,scope=runner
          cache-to: type=gha,mode=max,scope=runner

      - name: Smoke test deploy/compose.yaml
        env:
          STACK: deploy
          NO_BUILD: '1'
        run: ./scripts/smoke.sh

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: production-smoke-traces
          path: test-results/
          retention-days: 7
