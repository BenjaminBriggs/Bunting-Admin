name: Release

# Pushing a vX.Y.Z tag publishes ghcr.io/<owner>/bunting-admin:X.Y.Z (plus X.Y
# and X for stable releases) and a GitHub release carrying the deploy bundle.
# Nothing else deploys anything: instances upgrade by changing BUNTING_VERSION.

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  check-version:
    name: Tag matches package.json
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Compare versions
        run: |
          tag="${GITHUB_REF_NAME#v}"
          package="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$package" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${package}"
            exit 1
          fi

  smoke:
    needs: check-version
    uses: ./.github/workflows/image.yml

  publish:
    name: Publish image and release
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # GHCR image names must be lowercase.
      - name: Resolve image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/bunting-admin" >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # No `latest`: deployments pin an exact version. Pre-releases
      # (v1.2.0-rc.1) get only their exact tag.
      - name: Image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runner
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=release
          cache-to: type=gha,mode=max,scope=release
          provenance: mode=max
          sbom: true

      # Only what an operator copies into their own deployment repo, with
      # BUNTING_VERSION pinned to this release.
      - name: Build deploy bundle
        run: |
          version="${GITHUB_REF_NAME#v}"
          bundle="bunting-admin-deploy-${version}"
          mkdir -p "dist/${bundle}/scripts"
          sed "s#ghcr.io/benjaminbriggs/bunting-admin#${IMAGE}#" deploy/compose.yaml > "dist/${bundle}/compose.yaml"
          cp deploy/Caddyfile deploy/README.md "dist/${bundle}/"
          cp deploy/scripts/*.sh "dist/${bundle}/scripts/"
          sed "s/^BUNTING_VERSION=.*/BUNTING_VERSION=${version}/" deploy/.env.example > "dist/${bundle}/.env.example"
          tar -C dist -czf "dist/${bundle}.tar.gz" "${bundle}"
          echo "BUNDLE=dist/${bundle}.tar.gz" >> "$GITHUB_ENV"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" "$BUNDLE" \
            --verify-tag --generate-notes --title "$GITHUB_REF_NAME" $prerelease
